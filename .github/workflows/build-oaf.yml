name: build-oaf
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Cài công cụ
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib gettext git libncurses-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget zstd python3
      - name: Build OAF
        run: bash build-oaf.sh
      - name: Lưu kết quả
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oaf-apk-và-log
          path: |
            ~/oaf-build/out/*.apk
            ~/oaf-build/build.log
